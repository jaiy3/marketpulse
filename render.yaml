# Render Blueprint: one free web service runs the API and ingestion together.
# Frankfurt is the closest region to Lagos and avoids exchange geo-restrictions on US IPs.
services:
  - type: web
    name: marketpulse
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: INGEST_IN_PROCESS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://jaiyeadeboye-portfolio.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
